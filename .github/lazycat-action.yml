version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/litepan.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: litepan

build:
  run_buildscript: false

images:
  - id: litepan
    target: service
    service: litepan
    source: docker.io/ponphil/litepan
    channel: beta
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+-beta$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)-beta$'
    version_template: '{version}-beta'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: LitePan
    summary: "多网盘聚合挂载：WebDAV/STRM/媒体整理"
